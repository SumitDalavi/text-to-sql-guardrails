version: '3.8'

services:
  app:
    build: .
    ports:
      - '8080:8080'
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080

  # ── Tier 2 Companion Services (started via: docker compose --profile live up) ──
  postgres:
    image: postgres:15-alpine
    profiles: ["live"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sql_guardrails
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
